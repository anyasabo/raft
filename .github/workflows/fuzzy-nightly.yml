name: fuzzy-nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of fuzzy runs per mode
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  fuzzy:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            batchtest: false
          - name: batchtest
            batchtest: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          architecture: x64
          cache: true
      - name: run fuzzy suite repeatedly
        working-directory: fuzzy
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fuzzy-logs"
          metadata_file="${RUNNER_TEMP}/fuzzy-logs/${{ matrix.name }}-metadata.log"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            iterations="${{ github.event.inputs.iterations }}"
          else
            iterations=3
          fi

          {
            echo "go_version=$(go version)"
            echo "mode=${{ matrix.name }}"
            echo "batchtest=${{ matrix.batchtest }}"
            echo "iterations=${iterations}"
          } | tee -a "${metadata_file}"

          for i in $(seq 1 "${iterations}"); do
            seed=$(($(date +%s) + i))
            run_log="${RUNNER_TEMP}/fuzzy-logs/${{ matrix.name }}-run-${i}.log"
            echo "iteration=${i} shuffle_seed=${seed}" | tee -a "${metadata_file}"
            if [ "${{ matrix.batchtest }}" = "true" ]; then
              go test -count=1 -timeout=20m -shuffle="${seed}" -tags batchtest . 2>&1 | tee "${run_log}"
            else
              go test -count=1 -timeout=20m -shuffle="${seed}" . 2>&1 | tee "${run_log}"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzzy-logs-${{ matrix.name }}
          path: "${{ runner.temp }}/fuzzy-logs"
